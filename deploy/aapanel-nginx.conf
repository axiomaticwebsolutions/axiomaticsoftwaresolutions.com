# aaPanel Nginx: reverse proxy from https://<domain> to the app on 127.0.0.1:3000 (deploy/README.md "Website").
#
# Where it goes: aaPanel > Website > <domain> > Conf > Reverse proxy > Add reverse proxy (name "app", proxy dir "/",
# target URL http://127.0.0.1:3000, sent domain $host, cache OFF), save, then open that proxy's config file
# ("Conf" button in the proxy list) and REPLACE ITS WHOLE CONTENT with everything below. Save: aaPanel tests the
# configuration and reloads Nginx. Nothing below needs editing. aaPanel writes this file again whenever the proxy is
# changed in its form (or switched off and on): paste this content again after any such change.
# Before that: create the site as a static site (PHP "Pure static"; its folder /www/wwwroot/<domain> only serves the
# Let's Encrypt challenge, never the app's files), issue the Let's Encrypt certificate (SSL tab), turn on
# "Force HTTPS". Leave aaPanel's HSTS switch OFF and the site's Static-file cache / "Composition" features off.
#
# Matches the app's settings: TRUSTED_PROXY_HOPS=1 (this Nginx is the one proxy that appends to X-Forwarded-For),
# APP_URL=https://<domain> (Force HTTPS + the www redirect below make it the only address).
#
# Security headers: the app already sends Strict-Transport-Security (one year; includeSubDomains; preload only with
# SECURITY_HSTS_STRICT=true), Content-Security-Policy (a fresh nonce per response on the portal, admin, checkout and
# sign-in pages), X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy,
# Cross-Origin-Opener-Policy and X-Permitted-Cross-Domain-Policies (next.config.ts, middleware.ts, docs/security.md).
# Do not add any of them here or in aaPanel, or browsers receive each header twice. Never cache HTML here either: a
# cached page would repeat its CSP nonce.

# Let's Encrypt HTTP-01 renewals: aaPanel writes the challenge files into the site folder, so serve them from there
# instead of proxying them to the app. (If Nginx reports a duplicate location here, aaPanel already has this block:
# delete these four lines.)
location ^~ /.well-known/acme-challenge/ {
    default_type text/plain;
    try_files $uri =404;
}

# Scheduled jobs are called by aaPanel Cron on http://127.0.0.1:3000 directly (deploy/cron-*.sh), never through the
# internet: answer 404 here.
location ^~ /api/cron/ {
    return 404;
}

# `^~ /` is the longest prefix for every other path, so aaPanel's own regex locations in the site config (static file
# expiry for .js/.css/images, etc.) never take over: every request reaches the app, which sets its own Cache-Control.
location ^~ / {
    # One canonical host. APP_URL must be exactly the address in the browser (sign-in and forms check the Origin):
    # www.<domain> is sent to <domain>. Delete these three lines only if APP_URL itself uses www.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    # The app builds its redirects on APP_URL (or sends relative ones). Safety net: a Location that still names the
    # app's internal address (http(s)://localhost:3000/... or 127.0.0.1) becomes a path on this site instead.
    proxy_redirect ~^https?://(?:localhost|127\.0\.0\.1)(?::[0-9]+)?(/.*)$ $1;

    # The app reads the visitor's address from the right-most X-Forwarded-For entry (TRUSTED_PROXY_HOPS=1:
    # $proxy_add_x_forwarded_for appends $remote_addr, the address that really connected) and its own URL from
    # APP_URL. X-Real-IP is passed for logs only and never trusted.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Pass-through for a WebSocket upgrade (the production app uses none today; no hot reload in production).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Forms and API bodies are small; ticket attachments and installers go straight to the S3 bucket, not through here.
    client_max_body_size 12m;

    # Next.js streams pages (loading states): pass bytes on as they arrive.
    proxy_buffering off;

    # Never cache in Nginx. /api, /account, /admin, /checkout and order pages are per visitor, and Next.js sends its
    # own Cache-Control for everything (immutable for /_next/static).
    proxy_cache off;

    # No access log: order links carry a 30-day token in the query string (/orders/<id>?t=...) and aaPanel's log
    # format records full URLs. The site's error log stays on, and Nginx writes the request line (query string
    # included) there when the app does not answer, e.g. during the few seconds of a fork-mode restart: an order page
    # opened at that moment leaves its token in /www/wwwlogs/<domain>.error.log (go-live-checklist.md "Logs keep no
    # order-link tokens"; the page's status polls send the token in a header). To keep a log without query strings:
    #   1. aaPanel > App Store > Nginx > Settings > Config file, inside `http { ... }` add:
    #        log_format axs_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';
    #   2. Replace the next line with:   access_log /www/wwwlogs/<domain>.log axs_noquery;
    access_log off;
}
